<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KIM-BOT — Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-logo">
        🤖
      </div>

      <h1>KIM-BOT</h1>

      <p class="login-subtitle">
        Connect to your dashboard
      </p>

      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="btn btn-primary"
        >
          Login
        </button>

      </form>

      <p id="loginMessage"></p>

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to KIM-BOT
      </a>

    </section>

  </main>


  <script>
    "use strict";

    const loginForm =
      document.getElementById("loginForm");

    const loginMessage =
      document.getElementById("loginMessage");

    loginForm.addEventListener(
      "submit",
      function (event) {

        event.preventDefault();

        loginMessage.textContent =
          "⚠️ Login backend poko konekte.";

      }
    );
  </script>

</body>
</html>
