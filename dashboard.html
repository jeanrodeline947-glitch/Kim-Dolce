<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>KIM-BOT — Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      🤖 KIM<span>-BOT</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="commands.html">Commands</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>


  <main class="dashboard">

    <section class="dashboard-header">

      <span class="badge">
        CONTROL PANEL
      </span>

      <h1>
        KIM-BOT Dashboard
      </h1>

      <p>
        Welcome to your KIM-BOT control panel.
      </p>

    </section>


    <section class="dashboard-grid">

      <div class="dashboard-card">

        <div class="card-icon">
          🤖
        </div>

        <h2>Bot Status</h2>

        <p
          id="bot-status"
          class="status-offline"
        >
          ● Offline
        </p>

      </div>


      <div class="dashboard-card">

        <div class="card-icon">
          ⚡
        </div>

        <h2>Prefix</h2>

        <p>
          .
        </p>

      </div>


      <div class="dashboard-card">

        <div class="card-icon">
          📦
        </div>

        <h2>Version</h2>

        <p>
          KIM-BOT v2.0.0
        </p>

      </div>


      <div class="dashboard-card">

        <div class="card-icon">
          👑
        </div>

        <h2>Owner</h2>

        <p>
          KIM DOLCE
        </p>

      </div>

    </section>


    <section class="quick-actions">

      <h2>
        Quick Actions
      </h2>

      <div class="buttons">

        <a
          href="commands.html"
          class="btn btn-primary"
        >
          📚 View Commands
        </a>

        <a
          href="index.html"
          class="btn btn-secondary"
        >
          🏠 Home
        </a>

      </div>

    </section>

  </main>


  <footer>
    © <span id="year"></span>
    KIM-BOT — KIM DOLCE
  </footer>


  <script src="script.js"></script>

</body>
  </html>
